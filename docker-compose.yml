services:
  nikotracker:
    build: .
    container_name: nikotracker
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3847}:3847"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in Portainer stack env}
      PORT: "3847"
      PANEL_SECRET: ${PANEL_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
    volumes:
      - nikotracker-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nikotracker-data:
